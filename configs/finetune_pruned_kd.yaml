# Fine-tuning configuration for HRank-pruned Attention U-Net (filters=32 -> pruned) with DIST KD.

# Data & normalization
data_root: /content/datasets/landslide4senses/   # Dataset root directory
bands: [3, 2, 1]                                # 0-based RGB band indices (B4=R, B3=G, B2=B)
norm: l4s                                       # Normalization mode: 'l4s' or 'none'
stats_file: null                                # Optional JSON stats file; overrides norm when set
train_list: null                                # Optional txt file filtering training sample IDs
blacklist: /content/datasets/landslide4senses/blacklist.txt  # Sample IDs to exclude across splits

# Loss & metrics
loss: dice                                      # Task loss: 'dice', 'bce_dice', 'bce', 'structure', 'tversky', or 'focal_tversky'
threshold: 0.5                                  # Binary threshold for precision/recall/f1/iou

# Knowledge distillation (DIST)
teacher_dir: runs/sam2unet_l_rgb                # Teacher run dir with teacher_logits_{train,val}.h5
kd_weight: 1.0                                  # Weight on DIST loss
kd_tau: 1.0                                     # DIST temperature tau
kd_beta: 1.0                                    # DIST inter-class relation weight
kd_gamma: 1.0                                   # DIST intra-class relation weight
monitor: val_task_loss                          # Metric monitored by ModelCheckpoint & EarlyStopping

# Model & fine-tuning optimization
model: attention_unet                           # Pruned student architecture
filters: 32                                     # Base filter reference (overridden per-layer by channel_cfg)
channel_cfg: runs/pruned_kd_attunet_rgb_f32/channel_cfg.json         # Per-layer pruned channel counts
pretrained_weights: runs/pruned_kd_attunet_rgb_f32/pruned_init.weights.h5  # Pruned initial weights
lr: 0.0002                                      # Lower fine-tuning learning rate (~0.2x initial LR)
batch_size: 8                                   # Training and validation batch size
epochs: 100                                     # Fine-tuning epochs
patience: 20                                    # EarlyStopping patience on monitor

# Input pipeline
augment: true                                   # Joint random flips and 90-degree rotations (also applied to teacher logits)
color_jitter: true                              # Multispectral-only brightness/contrast perturbation on image only
color_brightness: 0.15                          # Max additive per-band brightness delta
color_contrast: 0.15                            # Max multiplicative per-band contrast delta ([1-c, 1+c])
color_prob: 0.5                                 # Probability of applying color perturbation per sample
cache: true                                     # Cache decoded samples + teacher logits in memory
cache_file: null                                # Optional tf.data cache file path

# Run output & reproducibility
output_dir: runs                                # Base directory for run artifacts
run_name: kd_attunet_rgb_f32_pruned_ft          # Custom run directory name (null = auto-generated)
seed: 42                                        # Random seed
mixed_precision: false                          # Enable Keras mixed_float16 policy
deterministic: false                            # Enable TensorFlow op determinism (slower)
eval_test: true                                 # Evaluate best checkpoint on test split after training
